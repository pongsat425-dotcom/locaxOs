name: Build Arch Linux Bootable ISO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # ปุ่มกดสั่งรันมือในหน้า Actions

jobs:
  build-iso:
    name: Compile Custom ISO with Archiso
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build ISO inside Official Arch Linux Docker Container
        run: |
          docker run --rm --privileged \
            -v ${{ github.workspace }}:/workspace \
            archlinux:latest \
            bash -c '
              set -e
              cd /workspace

              echo "==> 1. Initializing Arch Linux Keyring..."
              pacman -Sy --noconfirm archlinux-keyring
              pacman-key --init
              pacman-key --populate archlinux

              echo "==> 2. Installing archiso & build dependencies..."
              pacman -Syu --noconfirm --needed archiso squashfs-tools libisoburn git grub mtools dosfstools efibootmgr python3

              echo "==> 3. Checking & preparing profile directory..."
              if [ -d "archlive" ]; then
                PROFILE_DIR="archlive"
              elif [ -d "archiso" ]; then
                PROFILE_DIR="archiso"
              else
                echo "Warning: Profile directory not found. Copying default releng profile..."
                cp -r /usr/share/archiso/configs/releng archlive
                PROFILE_DIR="archlive"
              fi

              # Auto-fix missing bootloader directories for mkarchiso validation
              if [ ! -d "$PROFILE_DIR/syslinux" ] && [ -d "/usr/share/archiso/configs/releng/syslinux" ]; then
                echo "--> Copying missing syslinux configs..."
                cp -r /usr/share/archiso/configs/releng/syslinux "$PROFILE_DIR/"
              fi
              if [ ! -d "$PROFILE_DIR/efiboot" ] && [ -d "/usr/share/archiso/configs/releng/efiboot" ]; then
                echo "--> Copying missing efiboot configs..."
                cp -r /usr/share/archiso/configs/releng/efiboot "$PROFILE_DIR/"
              fi
              if [ ! -d "$PROFILE_DIR/grub" ] && [ -d "/usr/share/archiso/configs/releng/grub" ]; then
                echo "--> Copying missing grub configs..."
                cp -r /usr/share/archiso/configs/releng/grub "$PROFILE_DIR/" 2>/dev/null || true
              fi

              # Ensure syslinux is included in packages.x86_64
              if [ -f "$PROFILE_DIR/packages.x86_64" ]; then
                grep -q "^syslinux$" "$PROFILE_DIR/packages.x86_64" || echo "syslinux" >> "$PROFILE_DIR/packages.x86_64"
              fi

              # Modernize profiledef.sh bootmodes to avoid legacy validation errors
              if [ -f "$PROFILE_DIR/profiledef.sh" ]; then
                echo "--> Modernizing bootmodes in profiledef.sh..."
                python3 -c "
import re
path = \"$PROFILE_DIR/profiledef.sh\"
with open(path, \"r\") as f:
    text = f.read()
new_text = re.sub(r\"bootmodes=\([^)]*\)\", \"bootmodes=(\x27bios.syslinux\x27 \x27uefi.systemd-boot\x27)\", text, flags=re.DOTALL)
with open(path, \"w\") as f:
    f.write(new_text)
"
              fi

              echo "==> 4. Building Bootable ISO with mkarchiso..."
              mkdir -p out
              mkarchiso -v -w /tmp/archiso-build -o ./out "$PROFILE_DIR"
            '

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArchLinux-Custom-ISO
          path: out/*.iso
          retention-days: 7
