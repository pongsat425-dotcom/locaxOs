name: Build Arch Linux Bootable ISO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-iso:
    name: Compile ISO with Archiso
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build ISO using Arch Linux Docker Container
        run: |
          docker run --rm --privileged \
            -v ${{ github.workspace }}:/workspace \
            archlinux:latest \
            bash -c '
              set -e
              cd /workspace

              echo "==> 1. Initializing Arch Linux Keyring..."
              pacman -Sy --noconfirm archlinux-keyring
              pacman-key --init
              pacman-key --populate archlinux

              echo "==> 2. Installing archiso & build dependencies..."
              pacman -Syu --noconfirm --needed archiso squashfs-tools libisoburn git grub mtools dosfstools efibootmgr

              echo "==> 3. Checking profile directory..."
              if [ -d "archlive" ]; then
                PROFILE_DIR="archlive"
              elif [ -d "archiso" ]; then
                PROFILE_DIR="archiso"
              else
                echo "Warning: Neither archlive nor archiso folder found. Copying default releng profile..."
                cp -r /usr/share/archiso/configs/releng archlive
                PROFILE_DIR="archlive"
              fi

              # Ensure required bootloader directories exist for mkarchiso
              if [ ! -d "$PROFILE_DIR/syslinux" ] && [ -d "/usr/share/archiso/configs/releng/syslinux" ]; then
                echo "--> Copying missing syslinux configs from releng..."
                cp -r /usr/share/archiso/configs/releng/syslinux "$PROFILE_DIR/"
              fi
              if [ ! -d "$PROFILE_DIR/efiboot" ] && [ -d "/usr/share/archiso/configs/releng/efiboot" ]; then
                echo "--> Copying missing efiboot configs from releng..."
                cp -r /usr/share/archiso/configs/releng/efiboot "$PROFILE_DIR/"
              fi
              if [ ! -d "$PROFILE_DIR/grub" ] && [ -d "/usr/share/archiso/configs/releng/grub" ]; then
                echo "--> Copying missing grub configs from releng..."
                cp -r /usr/share/archiso/configs/releng/grub "$PROFILE_DIR/" 2>/dev/null || true
              fi

              # Ensure syslinux is in packages.x86_64
              if [ -f "$PROFILE_DIR/packages.x86_64" ]; then
                grep -q "^syslinux$" "$PROFILE_DIR/packages.x86_64" || echo "syslinux" >> "$PROFILE_DIR/packages.x86_64"
              fi

              # Modernize profiledef.sh bootmodes cleanly using sed
              if [ -f "$PROFILE_DIR/profiledef.sh" ]; then
                echo "--> Modernizing bootmodes in profiledef.sh..."
                sed -i -z "s/bootmodes=(\([^)]*\))/bootmodes=(\"bios.syslinux\" \"uefi.systemd-boot\")/g" "$PROFILE_DIR/profiledef.sh"
              fi

              echo "==> 4. Building Bootable ISO with mkarchiso using profile $PROFILE_DIR..."
              mkdir -p out
              mkarchiso -v -w /tmp/archiso-build -o ./out "$PROFILE_DIR"
            '

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: locaxlinux-1.0.0-ISO
          path: out/*.iso
          retention-days: 7
